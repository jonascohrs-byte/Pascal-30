<style>
* { box-sizing:border-box; margin:0; padding:0; }
html {
  height:100%;
  /* Fallback-Farbe hinter der Statusleiste, falls kein Verlauf greift */
  background:#1a1508;
}
body {
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(circle at 50% 0%, rgba(212,175,55,0.12) 0%, transparent 45%),
    linear-gradient(160deg,#1a1508 0%,#0d0d0d 45%,#000000 100%);
  background-attachment:fixed;
  display:flex;flex-direction:column;align-items:center;
  /* Safe-Area: Inhalt bleibt unter Notch/Statusleiste, Hintergrund füllt aber alles */
  padding-top:calc(26px + env(safe-area-inset-top));
  padding-left:calc(16px + env(safe-area-inset-left));
  padding-right:calc(16px + env(safe-area-inset-right));
  padding-bottom:calc(48px + env(safe-area-inset-bottom));
  font-family:"Georgia","Times New Roman",serif;
  overflow-x:hidden;
}

.crown { font-size:34px;margin-bottom:2px;filter:drop-shadow(0 0 12px rgba(212,175,55,0.7)); }

h1 {
  color:#f5e9c8;
  font-size:clamp(19px,5vw,29px);
  font-weight:bold;
  text-align:center;margin-bottom:4px;
  letter-spacing:0.5px;
  text-shadow:0 0 18px rgba(212,175,55,0.5);
}
h1 .gold {
  background:linear-gradient(180deg,#f9e08a 0%,#d4af37 50%,#a67c00 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.badge30 {
  display:inline-block;margin:6px 0 2px;padding:3px 16px;
  border:1px solid #d4af37;border-radius:20px;
  color:#d4af37;font-size:13px;letter-spacing:3px;text-transform:uppercase;
}
.sub { color:rgba(245,233,200,0.5);font-size:13px;margin:10px 0 26px;text-align:center;font-family:Arial,sans-serif; }

.arena {
  position:relative;
  width:min(360px,92vw);height:min(360px,92vw);
  display:flex;align-items:center;justify-content:center;
  /* Platz für Arm oben und Füße unten, die über den Ring ragen */
  margin-top:calc(min(360px,92vw) * 0.06);
  margin-bottom:calc(min(360px,92vw) * 0.16);
}

/* Innerer Farbring (die 4 Felder) */
.ring { position:absolute;inset:0;border-radius:50%;overflow:hidden;z-index:1; }
.seg { position:absolute;display:flex;align-items:center;justify-content:center;text-align:center; }
.seg-top    { top:0;left:0;width:100%;height:50%;background:linear-gradient(180deg,#2a2a2a,#1a1a1a); }
.seg-right  { top:0;right:0;width:50%;height:100%;background:linear-gradient(90deg,#3a2f10,#2a2208); }
.seg-bottom { bottom:0;left:0;width:100%;height:50%;background:linear-gradient(0deg,#2a2a2a,#1a1a1a); }
.seg-left   { top:0;left:0;width:50%;height:100%;background:linear-gradient(270deg,#3a2f10,#2a2208); }

.cross { position:absolute;background:rgba(212,175,55,0.45);pointer-events:none;z-index:2; }
.ch { width:100%;height:2px;top:calc(50% - 1px); }
.cv { height:100%;width:2px;left:calc(50% - 1px); }

/* Labels über dem Ring, aber UNTER dem großen Foto-Overlay-Effekt.
   z-index 4 – liegen auf dem Ring. Das Foto (z-index 6) ragt darüber. */
.labels { position:absolute;inset:0;border-radius:50%;z-index:8;pointer-events:none;overflow:hidden; }
.lbl {
  position:absolute;
  font-family:"Georgia",serif;
  font-size:clamp(13px,3.4vw,17px);
  font-weight:bold;line-height:1.2;letter-spacing:1px;
  color:#f5e9c8;text-align:center;text-transform:uppercase;
  text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 0 10px rgba(0,0,0,1);
}
.lbl-top    { top:4%;left:50%;transform:translateX(-50%); }
.lbl-right  { top:31%;right:2%;transform:translateY(-50%);width:22%;white-space:normal; }
.lbl-bottom { bottom:4%;left:50%;transform:translateX(-50%); }
.lbl-left   { top:31%;left:2%;transform:translateY(-50%);width:22%;white-space:normal; }
.lbl-gold { color:#f0d060; }

/* Goldener Rand des inneren Rings */
.border-ring {
  position:absolute;inset:0;border-radius:50%;
  border:3px solid #d4af37;
  box-shadow:0 0 0 1px rgba(212,175,55,0.4),0 0 45px rgba(212,175,55,0.35);
  pointer-events:none;z-index:5;
}

/* Das große drehende Foto – Zentrum = Arena-Zentrum.
   GRÖSSER als der Ring, damit Arme/Beine hinausragen. */
.photo-wrap {
  position:absolute;
  width:122%;height:122%;
  left:50%;top:50%;
  z-index:6;
  transform-origin:center center;
  transform:translate(-50%,-50%) rotate(0deg);
  pointer-events:none;
}
.photo-wrap img {
  width:100%;height:100%;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,0.6));
}

/* Zeiger oben */
.ptr-wrap { position:absolute;top:-14px;left:50%;transform:translateX(-50%);z-index:12; }
.ptr {
  width:0;height:0;
  border-left:13px solid transparent;border-right:13px solid transparent;
  border-top:28px solid #d4af37;
  filter:drop-shadow(0 2px 8px rgba(212,175,55,1));
}

/* Ergebnis */
.result-area {
  width:100%;max-width:520px;
  min-height:68px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;margin-bottom:22px;
}
.result-box {
  width:100%;
  background:linear-gradient(160deg,rgba(212,175,55,0.14),rgba(0,0,0,0.3));
  border:1px solid rgba(212,175,55,0.5);
  border-radius:14px;
  padding:16px 28px;text-align:center;
  display:none;
}
.rlabel { font-size:11px;color:rgba(245,233,200,0.55);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;font-family:Arial,sans-serif; }
.rtext  { font-size:27px;font-weight:bold;color:#f5e9c8; }
.saufen .rtext { color:#f0d060;text-shadow:0 0 20px rgba(240,208,96,0.9); }
.action  .rtext { color:#ffc040;text-shadow:0 0 20px rgba(255,192,64,0.9); }
.glueck  .rtext { color:#a8e6a0;text-shadow:0 0 20px rgba(140,220,140,0.9); }

/* Action-Aufgabe */
.task-box {
  margin-top:12px;padding-top:14px;
  border-top:1px solid rgba(212,175,55,0.3);
}
.task-text {
  font-family:Arial,sans-serif;
  font-size:17px;color:#f5e9c8;line-height:1.45;
}
.task-answer {
  display:none;
  margin-top:12px;padding:10px 14px;
  background:rgba(168,230,160,0.12);
  border:1px solid rgba(168,230,160,0.4);
  border-radius:10px;
  font-family:Arial,sans-serif;
  font-size:15px;color:#c8f0c0;line-height:1.45;
}
.tap-hint {
  display:none;margin-top:10px;
  font-family:Arial,sans-serif;font-size:12px;
  color:rgba(212,175,55,0.7);font-style:italic;
}

.result-text2 {
  display:none;
  color:#e8d9a8;font-size:16px;font-style:italic;font-weight:bold;
  text-align:center;font-family:"Georgia",serif;
  text-shadow:0 0 14px rgba(212,175,55,0.6);
}

#btn {
  background:linear-gradient(180deg,#f9e08a 0%,#d4af37 45%,#a67c00 100%);
  border:none;color:#1a1508;font-size:20px;font-weight:bold;
  font-family:"Georgia",serif;
  padding:15px 54px;border-radius:50px;cursor:pointer;letter-spacing:1px;
  box-shadow:0 4px 24px rgba(212,175,55,0.55);
  transition:transform 0.12s,box-shadow 0.12s;
  -webkit-tap-highlight-color:transparent;
}
#btn:hover:not(:disabled) { transform:scale(1.05);box-shadow:0 6px 32px rgba(212,175,55,0.8); }
#btn:active:not(:disabled) { transform:scale(0.97); }
#btn:disabled { opacity:0.4;cursor:not-allowed; }

.cp { position:fixed;pointer-events:none;animation:fall linear forwards;z-index:999; }
@keyframes fall {
  0%   { transform:translateY(-20px) rotate(0deg);opacity:1; }
  100% { transform:translateY(110vh) rotate(720deg);opacity:0; }
}
</style>
</head>

<div class="result-area">
  <div class="result-box" id="rb">
    <div class="rlabel">Pascal muss</div>
    <div class="rtext" id="rt"></div>
    <div class="task-box" id="taskBox" style="display:none">
      <div class="task-text" id="taskText"></div>
      <div class="task-answer" id="taskAnswer"></div>
      <div class="tap-hint" id="tapHint">Tippe f&uuml;r die Antwort &#128071;</div>
    </div>
  </div>
  <div class="result-text2" id="msg">&#128149; Charleen wird dich daf&uuml;r lieben &#128149;</div>
</div>

<button id="btn" onclick="spin()">&#127942; DREHEN!</button>

<script>
const outcomes = [
  { label:'SAUFEN!',            targetAngle:0,   cls:'saufen' },
  { label:'ACTION-RUNDE!',      targetAngle:90,  cls:'action'  },
  { label:'SAUFEN!',            targetAngle:180, cls:'saufen'  },
  { label:'GL\u00dcCK GEHABT!', targetAngle:270, cls:'glueck'  }
];

// Action-Aufgaben. type 'task' = einfache Aufgabe, type 'quiz' = Frage mit Antwort
const actionTasks = [
  { type:'quiz', text:'Nenne 5 Staaten in Afrika mit dazugeh\u00f6riger Hauptstadt.',
    answer:'z.B. \u00c4gypten\u2013Kairo, Kenia\u2013Nairobi, Marokko\u2013Rabat, Nigeria\u2013Abuja, S\u00fcdafrika\u2013Pretoria' },
  { type:'task', text:'Rufe eine Mutter in deinem Telefonbuch an und erz\u00e4hl ihr, dass du sie liebst.' },
  { type:'task', text:'Die Runde w\u00e4hlt einen Shot f\u00fcr dich aus \u2013 du hast kein Mitspracherecht.' },
  { type:'task', text:'Mache ein Modelfoto \u2013 volle Pose!' },
  { type:'task', text:'Die n\u00e4chsten 10 Minuten darfst du nur in Reimen sprechen.' },
  { type:'task', text:'Schnorre dir eine Kippe bei einer fremden Person.' },
  { type:'task', text:'Trink dein aktuelles Getr\u00e4nk in einem Zug aus (Ex).' },
  { type:'task', text:'Fordere eine wildfremde Person zum Tanzen auf \u2013 mindestens 30 Sekunden.' },
  { type:'task', text:'Verteile in 2 Minuten an 5 verschiedene Leute ein ehrliches Kompliment.' },
  { type:'task', text:'Du tr\u00e4gst f\u00fcr die n\u00e4chste halbe Stunde einen albernen Spitznamen, den die Gruppe festlegt.' },
  // 5 weitere Quizfragen (mittelschwer)
  { type:'quiz', text:'Wie viele Knochen hat ein erwachsener Mensch?', answer:'206' },
  { type:'quiz', text:'In welchem Jahr fiel die Berliner Mauer?', answer:'1989' },
  { type:'quiz', text:'Welcher Planet ist der gr\u00f6\u00dfte in unserem Sonnensystem?', answer:'Jupiter' },
  { type:'quiz', text:'Wie hei\u00dft die Hauptstadt von Australien?', answer:'Canberra (nicht Sydney!)' },
  { type:'quiz', text:'Aus welchem Land stammt die Automarke \u0160koda?', answer:'Tschechien' }
];

let curAngle=0, spinning=false;
let answerRevealed=true; // true = kein offenes Quiz gerade

function spin(){
  if(spinning) return;
  spinning=true;
  document.getElementById('btn').disabled=true;
  document.getElementById('rb').style.display='none';
  document.getElementById('msg').style.display='none';
  document.getElementById('taskBox').style.display='none';
  document.getElementById('taskAnswer').style.display='none';
  document.getElementById('tapHint').style.display='none';
  answerRevealed=true;

  const pick=outcomes[Math.floor(Math.random()*outcomes.length)];
  const rounds=5+Math.floor(Math.random()*4);
  const curMod=((curAngle%360)+360)%360;
  const delta=((pick.targetAngle-curMod)+360)%360;
  const finalAngle=curAngle+rounds*360+delta;
  const duration=4000+Math.random()*800;
  const startAngle=curAngle;
  const startTime=performance.now();
  function easeOut(t){ return 1-Math.pow(1-t,4); }
  function frame(now){
    const p=Math.min((now-startTime)/duration,1);
    const a=startAngle+(finalAngle-startAngle)*easeOut(p);
    document.getElementById('pw').style.transform='translate(-50%,-50%) rotate('+a+'deg)';
    if(p<1){ requestAnimationFrame(frame); }
    else{
      curAngle=finalAngle;
      spinning=false;
      document.getElementById('btn').disabled=false;
      showResult(pick);
    }
  }
  requestAnimationFrame(frame);
}

function showResult(pick){
  const rb=document.getElementById('rb');
  document.getElementById('rt').textContent=pick.label;
  rb.className='result-box '+pick.cls;
  rb.style.display='block';
  document.getElementById('msg').style.display='block';

  if(pick.cls==='action'){
    const task=actionTasks[Math.floor(Math.random()*actionTasks.length)];
    document.getElementById('taskText').textContent=task.text;
    const ansEl=document.getElementById('taskAnswer');
    const hintEl=document.getElementById('tapHint');
    ansEl.style.display='none';
    if(task.type==='quiz'){
      ansEl.textContent='Antwort: '+task.answer;
      hintEl.style.display='block';
      answerRevealed=false;
    }else{
      hintEl.style.display='none';
      answerRevealed=true;
    }
    document.getElementById('taskBox').style.display='block';
  }

  const cols=pick.cls==='glueck'
    ?['#a8e6a0','#6cc46c','#f5e9c8']
    :['#d4af37','#f9e08a','#ffc040','#f5e9c8','#a67c00'];
  for(let i=0;i<70;i++) setTimeout(()=>spawnConfetti(cols),i*28);
}

// Klick/Tap auf Bildschirm -> Antwort aufdecken (nur bei offenem Quiz)
document.addEventListener('click', function(e){
  if(answerRevealed) return;
  if(e.target.id==='btn') return; // Button nicht abfangen
  document.getElementById('taskAnswer').style.display='block';
  document.getElementById('tapHint').style.display='none';
  answerRevealed=true;
});

function spawnConfetti(cols){
  const el=document.createElement('div');
  el.className='cp';
  const c=cols[Math.floor(Math.random()*cols.length)];
  const s=6+Math.random()*9;
  const d=2+Math.random()*2;
  el.style.cssText='left:'+(Math.random()*100)+'%;top:0;background:'+c+';width:'+s+'px;height:'+s+'px;border-radius:'+(Math.random()>.5?'50%':'2px')+';animation-duration:'+d+'s';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),d*1000+300);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
